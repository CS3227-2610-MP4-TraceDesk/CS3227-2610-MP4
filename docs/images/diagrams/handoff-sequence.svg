<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="900" viewBox="0 0 1150 900" role="img" aria-labelledby="title desc">
<title id="title">TraceDesk resolution handoff and QA close sequence</title>
<desc id="desc">Developer submits a resolution. Authorization, version check, resolution, status and audit commit together. QA then saves passing checks and closes the report in another transaction.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#40546e"/></marker></defs>
<rect width="1150" height="900" fill="white"/>
<g font-family="Helvetica,Arial,sans-serif" fill="#182536">
<text x="575" y="34" text-anchor="middle" font-size="22">TraceDesk — UML resolution handoff sequence</text>
<rect x="5" y="65" width="180" height="48" rx="4" fill="#f3f6fa" stroke="#53657d"/>
<text x="95" y="94" text-anchor="middle" font-size="14">Developer</text>
<line x1="95" y1="113" x2="95" y2="850" stroke="#8291a4" stroke-dasharray="6 5"/>
<rect x="245" y="65" width="180" height="48" rx="4" fill="#f3f6fa" stroke="#53657d"/>
<text x="335" y="94" text-anchor="middle" font-size="14">Role API / security</text>
<line x1="335" y1="113" x2="335" y2="850" stroke="#8291a4" stroke-dasharray="6 5"/>
<rect x="485" y="65" width="180" height="48" rx="4" fill="#f3f6fa" stroke="#53657d"/>
<text x="575" y="94" text-anchor="middle" font-size="14">Application + store</text>
<line x1="575" y1="113" x2="575" y2="850" stroke="#8291a4" stroke-dasharray="6 5"/>
<rect x="725" y="65" width="180" height="48" rx="4" fill="#f3f6fa" stroke="#53657d"/>
<text x="815" y="94" text-anchor="middle" font-size="14">PostgreSQL</text>
<line x1="815" y1="113" x2="815" y2="850" stroke="#8291a4" stroke-dasharray="6 5"/>
<rect x="965" y="65" width="180" height="48" rx="4" fill="#f3f6fa" stroke="#53657d"/>
<text x="1055" y="94" text-anchor="middle" font-size="14">QA reviewer</text>
<line x1="1055" y1="113" x2="1055" y2="850" stroke="#8291a4" stroke-dasharray="6 5"/>
<line x1="95" y1="165" x2="335" y2="165" stroke="#40546e" marker-end="url(#arrow)"/>
<text x="215.0" y="155" text-anchor="middle" font-size="13">1. Send to QA (fields + expectedVersion)</text>
<line x1="335" y1="220" x2="575" y2="220" stroke="#40546e" marker-end="url(#arrow)"/>
<text x="455.0" y="210" text-anchor="middle" font-size="13">Trusted actor + CSRF-checked command</text>
<line x1="575" y1="275" x2="815" y2="275" stroke="#40546e" marker-end="url(#arrow)"/>
<text x="695.0" y="265" text-anchor="middle" font-size="13">Authorize / lock report / check version + state</text>
<rect x="455" y="300" width="455" height="42" fill="#fff9e8" stroke="#cbbd8a"/>
<text x="682" y="326" text-anchor="middle" font-size="13">Transaction: resolution + READY_FOR_QA + audit</text>
<line x1="815" y1="375" x2="575" y2="375" stroke="#40546e" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="695.0" y="365" text-anchor="middle" font-size="13">Commit: report version + resolution revision</text>
<line x1="575" y1="420" x2="335" y2="420" stroke="#40546e" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="455.0" y="410" text-anchor="middle" font-size="13">Confirmed handoff</text>
<line x1="335" y1="465" x2="95" y2="465" stroke="#40546e" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="215.0" y="455" text-anchor="middle" font-size="13">Display Ready for QA</text>
<line x1="1055" y1="535" x2="335" y2="535" stroke="#40546e" marker-end="url(#arrow)"/>
<text x="695.0" y="525" text-anchor="middle" font-size="13">2. Verify and close (passing checks + version)</text>
<line x1="335" y1="590" x2="575" y2="590" stroke="#40546e" marker-end="url(#arrow)"/>
<text x="455.0" y="580" text-anchor="middle" font-size="13">Trusted QA actor + CSRF-checked command</text>
<line x1="575" y1="645" x2="815" y2="645" stroke="#40546e" marker-end="url(#arrow)"/>
<text x="695.0" y="635" text-anchor="middle" font-size="13">Authorize / lock / check current resolution + version</text>
<rect x="455" y="670" width="455" height="42" fill="#fff9e8" stroke="#cbbd8a"/>
<text x="682" y="696" text-anchor="middle" font-size="13">Transaction: verification + CLOSED + audit</text>
<line x1="815" y1="745" x2="575" y2="745" stroke="#40546e" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="695.0" y="735" text-anchor="middle" font-size="13">Commit: new version + closed review</text>
<line x1="575" y1="790" x2="335" y2="790" stroke="#40546e" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="455.0" y="780" text-anchor="middle" font-size="13">Confirmed decision</text>
<line x1="335" y1="835" x2="1055" y2="835" stroke="#40546e" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="695.0" y="825" text-anchor="middle" font-size="13">Display Closed</text>
</g></svg>
