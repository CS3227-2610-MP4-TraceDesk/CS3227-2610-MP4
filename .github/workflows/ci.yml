name: Foundation CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Check portable resources and module boundaries
        run: python3 tools/check_foundation.py
      - name: Test synthetic provider transport
        run: ./gradlew :backend:ai-transport:test --no-daemon
      - name: Preserve revision-linked test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-tests-${{ github.sha }}
          path: |
            backend/ai-transport/build/test-results/test/
            backend/ai-transport/build/reports/tests/test/
          retention-days: 7
