name: Foundation CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Check portable resources and module boundaries
        run: python3 tools/check_foundation.py
      - name: Test synthetic provider transport
        run: ./gradlew :backend:ai-transport:test --no-daemon
      - name: Preserve revision-linked test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-tests-${{ github.sha }}
          path: |
            backend/ai-transport/build/test-results/test/
            backend/ai-transport/build/reports/tests/test/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck, lint, unit tests and production build
        working-directory: frontend
        run: npm run check && npm run build
      - name: Install Chromium for static browser smoke test
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser and accessibility smoke test
        working-directory: frontend
        run: npm run test:e2e
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-smoke-${{ github.sha }}
          path: |
            frontend/e2e-results/
            frontend/test-results/
          retention-days: 7

  isolated-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: tracedesk_test
          POSTGRES_USER: tracedesk_test
          POSTGRES_PASSWORD: synthetic_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracedesk_test -d tracedesk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TRACEDESK_TEST_DATABASE_CONFIRM_ISOLATED: 'true'
      TRACEDESK_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/tracedesk_test
      TRACEDESK_TEST_DATABASE_USER: tracedesk_test
      TRACEDESK_TEST_DATABASE_PASSWORD: synthetic_test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify schema guards and owned-schema lifecycle
        run: ./gradlew :backend:db-test-support:test --no-daemon
      - name: Preserve PostgreSQL test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-database-${{ github.sha }}
          path: |
            backend/db-test-support/build/test-results/test/
            backend/db-test-support/build/reports/tests/test/
          retention-days: 7
