spring.flyway.enabled=true
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
spring.datasource.url=${TRACEDESK_DATABASE_URL}
spring.datasource.username=${TRACEDESK_DATABASE_USER}
spring.datasource.password=${TRACEDESK_DATABASE_PASSWORD}
server.servlet.session.cookie.name=TDSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.servlet.session.tracking-modes=cookie
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.read.strict-duplicate-detection=true
