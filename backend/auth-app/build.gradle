plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.tracedesk'
version = '0.1.0-SNAPSHOT'
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
repositories { mavenCentral() }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.session:spring-session-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.81'
    runtimeOnly 'org.postgresql:postgresql:42.7.10'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation project(':backend:db-test-support')
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(Test).configureEach { useJUnitPlatform() }

tasks.register('reporterBrowserFixture', JavaExec) {
    group = 'verification'
    description = 'Runs the isolated synthetic backend for the Reporter real-browser test.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.tracedesk.auth.api.ReporterBrowserFixture'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}
